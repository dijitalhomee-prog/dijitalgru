<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Dijitalgru QR Studio{% endblock %}</title>
    <meta name="description" content="{% block description %}Dijitalgru QR Studio{% endblock %}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        html, body { min-height: 100%; }
        body {
            background: radial-gradient(1200px 600px at 50% -10%, rgba(99,102,241,.35), transparent 60%),
                        linear-gradient(180deg, #0b1020 0%, #14123a 100%);
            color: #f8fafc; min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px 16px; -webkit-text-size-adjust: 100%;
        }
        .pb-card {
            width: 100%; max-width: 440px; text-align: center;
            background: rgba(30,41,59,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.1); border-radius: 26px;
            padding: 34px 24px 26px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
            animation: pb-in .45s ease both;
        }
        @keyframes pb-in { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none; } }
        .pb-icon {
            width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px;
            display: flex; align-items: center; justify-content: center; font-size: 34px;
            background: linear-gradient(135deg, rgba(99,102,241,.35), rgba(16,185,129,.25));
            border: 1px solid rgba(255,255,255,.12);
        }
        h1 { font-size: 21px; font-weight: 800; margin-bottom: 8px; line-height: 1.3; }
        .pb-sub { font-size: 14px; color: #94a3b8; line-height: 1.55; margin-bottom: 20px; }
        .pb-box {
            text-align: left; background: rgba(15,23,42,.7); border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; word-break: break-word;
        }
        .pb-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #818cf8; margin-bottom: 4px; }
        .pb-value { font-size: 16px; font-weight: 600; color: #f1f5f9; white-space: pre-wrap; line-height: 1.5; }
        .pb-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
            padding: 15px; margin-top: 10px; border: 0; border-radius: 14px; cursor: pointer;
            font-size: 15px; font-weight: 700; color: #fff; text-decoration: none;
            background: linear-gradient(135deg, #6366f1, #4f46e5); box-shadow: 0 6px 20px rgba(79,70,229,.4);
            transition: transform .15s, filter .15s;
        }
        .pb-btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
        .pb-btn.secondary { background: rgba(255,255,255,.08); box-shadow: none; border: 1px solid rgba(255,255,255,.14); }
        .pb-btn.ok { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 6px 20px rgba(16,185,129,.35); }
        .pb-foot { margin-top: 22px; font-size: 12px; color: #64748b; }
        .pb-foot a { color: #818cf8; text-decoration: none; font-weight: 600; }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <main class="pb-card">
        {% block content %}{% endblock %}
        <div class="pb-foot">Powered by <a href="https://qrdijitalgru.com" rel="noopener">Dijitalgru QR Studio</a></div>
    </main>
    <script>
    function pbCopy(text, btn) {
        var done = function () {
            if (!btn) return;
            var old = btn.getAttribute('data-label') || btn.textContent;
            btn.setAttribute('data-label', old);
            btn.textContent = '✓ Kopyalandı';
            setTimeout(function () { btn.textContent = old; }, 1800);
        };
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(done, function () { pbFallbackCopy(text); done(); });
        } else { pbFallbackCopy(text); done(); }
    }
    function pbFallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
