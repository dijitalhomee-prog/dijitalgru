    <style>
        :root {
            --bg-dark: #090c15;
            --bg-card: rgba(21, 26, 43, 0.7);
            --bg-card-hover: rgba(30, 38, 61, 0.85);
            --wa-green: #25D366;
            --wa-dark-green: #128C7E;
            --wa-bubble-user: #005c4b;
            --wa-bubble-bot: #202c33;
            --accent-gold: #f59e0b;
            --accent-cyan: #00f2fe;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.1);
            --border-wa: rgba(37, 211, 102, 0.3);
            --radius-lg: 20px;
            --radius-md: 12px;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* Ambient Glow Background */
        .ambient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: var(--wa-green);
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: var(--accent-purple);
            bottom: -150px;
            right: -100px;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            background: var(--accent-cyan);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
            100% { transform: scale(1.1) translate(20px, 30px); opacity: 0.35; }
        }

        /* Top Header Navigation */
        .presentation-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            background: rgba(9, 12, 21, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
        }

        .brand-logo i {
            color: var(--wa-green);
            font-size: 1.6rem;
        }

        .brand-tag {
            font-size: 0.75rem;
            background: rgba(37, 211, 102, 0.15);
            color: var(--wa-green);
            border: 1px solid var(--border-wa);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .slide-counter {
            font-family: var(--font-head);
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .slide-counter span {
            color: var(--text-main);
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn-header {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-header:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Slides Container */
        .slides-wrapper {
            position: relative;
            width: 100vw;
            height: calc(100vh - 140px);
            margin-top: 70px;
            z-index: 10;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transform: translateY(30px) scale(0.98);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        /* Slide Typography & Layouts */
        .slide-header {
            margin-bottom: 24px;
        }

        .slide-subtitle {
            font-family: var(--font-head);
            color: var(--wa-green);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slide-title {
            font-family: var(--font-head);
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-top: 8px;
            max-width: 850px;
            line-height: 1.55;
        }

        /* Grid Layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Glass Cards */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 26px;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: rgba(37, 211, 102, 0.1);
            color: var(--wa-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 16px;
            border: 1px solid var(--border-wa);
        }

        .card-title {
            font-family: var(--font-head);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card-text {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;
        }

        /* Hero Slide Specifics */
        .hero-slide {
            text-align: center;
            align-items: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(37, 211, 102, 0.12);
            border: 1px solid var(--border-wa);
            color: var(--wa-green);
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .hero-title {
            font-family: var(--font-head);
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            max-width: 1000px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 0%, #a78bfa 50%, #38ef7d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 800px;
            line-height: 1.6;
            margin-bottom: 34px;
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-val {
            font-family: var(--font-head);
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--wa-green);
        }

        .stat-lbl {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Comparison Table Specifics */
        .compare-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 10px;
        }

        .bad-card {
            border: 1px solid rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.05);
        }

        .good-card {
            border: 1px solid var(--border-wa);
            background: rgba(37, 211, 102, 0.06);
        }

        .price-list {
            list-style: none;
            margin-top: 14px;
        }

        .price-list li {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-glass);
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
        }

        .price-list li strong {
            color: #ef4444;
        }

        .good-card .price-list li strong {
            color: var(--wa-green);
        }

        /* WhatsApp Template Phone Mockup */
        .chat-simulator-container {
            width: 100%;
            max-width: 400px;
            height: 500px;
            background: #0b141a;
            border-radius: 24px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 0 auto;
        }

        .chat-sim-header {
            background: #202c33;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar-box {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #128C7E, #25D366);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1rem;
        }

        .chat-sim-info h4 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e9edef;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-verified {
            color: #38ef7d;
            font-size: 0.8rem;
        }

        .chat-sim-info p {
            font-size: 0.72rem;
            color: #8696a0;
        }

        .chat-sim-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 16px 16px;
        }

        .template-card {
            background: var(--wa-bubble-bot);
            border-radius: 12px;
            padding: 12px;
            color: #e9edef;
            font-size: 0.86rem;
            line-height: 1.45;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .template-header-img {
            width: 100%;
            height: 130px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--wa-green);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .template-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            background: rgba(37, 211, 102, 0.12);
            color: var(--wa-green);
            border: 1px solid var(--border-wa);
            border-radius: 8px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
        }

        /* Bottom Controls Bar */
        .presentation-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            background: rgba(9, 12, 21, 0.8);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-glass);
        }

        .nav-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: var(--wa-green);
            width: 28px;
            border-radius: 10px;
        }

        .ctrl-btns {
            display: flex;
            gap: 12px;
        }

        .btn-nav {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .btn-nav:hover {
            background: var(--wa-green);
            color: #090c15;
            border-color: var(--wa-green);
            transform: scale(1.05);
        }

        /* PDF Print Styling */
        @media print {
            body { overflow: visible !important; height: auto !important; }
            .presentation-header, .presentation-footer, .ambient-bg { display: none !important; }
            .slides-wrapper { height: auto !important; margin-top: 0 !important; }

    <!-- Slides Container -->
    <main class="slides-wrapper">

        <!-- SLIDE 1: Cover -->
        <section class="slide active hero-slide">
            <div class="hero-badge">
                <i class="fa-solid fa-laptop-code"></i> Anahtar Teslim WhatsApp Gönderim Yazılımı
            </div>
            <h1 class="hero-title">Markanıza Özel Meta Onaylı WhatsApp Gönderim Yazılımı & Kurulumu</h1>
            <p class="hero-desc">Aylık aracı paket ve komisyon ödemelerine son! Markanıza doğrudan Meta onaylı WhatsApp mesaj gönderim sistemini kuruyoruz. Yazılım doğrudan sizin mülkiyetinizde çalışır.</p>
            
            <div class="hero-stats">
                <div class="stat-item">
                    <div class="stat-val">Tek Sefer</div>
                    <div class="stat-lbl">Yazılım & Kurulum Bedeli</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">0 TL</div>
                    <div class="stat-lbl">Aracı Paket / Kredi Komisyonu</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">$17</div>
                    <div class="stat-lbl">1.800 Mesaj Meta Net Maliyeti</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val">%100</div>
                    <div class="stat-lbl">Markaya Özel Mülkiyet</div>
                </div>
            </div>
        </section>

        <!-- SLIDE 2: Market Reality & Problem -->
        <section class="slide">
            <div class="slide-header">
                <div class="slide-subtitle"><i class="fa-solid fa-triangle-exclamation"></i> Piyasa Gerçeği & Problem</div>
                <h2 class="slide-title">İşletmeler Neden Aracı Paket Sistemlerinde Kaybediyor?</h2>
                <p class="slide-desc">SMS ve e-postanın etkisini yitirdiği günümüzde markalar WhatsApp'a bağımlı hale geldi. Ancak aracı paket kiralama sistemleri ciddi bütçe kaybı yaratıyor.</p>
            </div>
            <div class="grid-3">
                <div class="glass-card" style="border-left: 4px solid #ef4444;">
                    <div class="card-icon" style="background: rgba(239,68,68,0.1); color: #ef4444; border-color: rgba(239,68,68,0.3);"><i class="fa-solid fa-coins"></i></div>
                    <h3 class="card-title">Sürekli Ödenen Paket Kredileri</h3>
                    <p class="card-text">Aracı firmalardan paket kiraladığınızda 1.000 kişi için 479 TL, 10.000 kişi için 4.789 TL gibi sürekli tekrar eden fahiş kredi maliyetleri ödersiniz.</p>
                </div>
                <div class="glass-card" style="border-left: 4px solid #f59e0b;">
                    <div class="card-icon" style="background: rgba(245,158,11,0.1); color: #f59e0b; border-color: rgba(245,158,11,0.3);"><i class="fa-solid fa-shield-virus"></i></div>
                    <h3 class="card-title">Ban & Engellenme Riski</h3>
                    <p class="card-text">Meta dışı kaçak bot yazılımları kullanıldığında kurumsal WhatsApp numaranız anında spama düşüp kapatılır.</p>
                </div>
                <div class="glass-card" style="border-left: 4px solid #8b5cf6;">
                    <div class="card-icon" style="background: rgba(139,92,246,0.1); color: #8b5cf6; border-color: rgba(139,92,246,0.3);"><i class="fa-solid fa-network-wired"></i></div>
                    <h3 class="card-title">Sistem Bağımlılığı</h3>
                    <p class="card-text">Kendi yazılım altyapınız olmadığında müşteri listenizi ve gönderim süreçlerinizi üçüncü taraf platformlara bağımlı yönetirsiniz.</p>
                </div>
            </div>
        </section>

        <!-- SLIDE 3: Business Model Comparison -->
        <section class="slide">
            <div class="slide-header">
                <div class="slide-subtitle"><i class="fa-solid fa-scale-unbalanced-flip"></i> İş Modeli Karşılaştırması</div>
                <h2 class="slide-title">Aracı Paket Kiralama vs. X Markası Yazılım Satışı</h2>
                <p class="slide-desc">Yazılımı doğrudan markanıza kuruyoruz. Sistem sizin oluyor, aracılara her ay paket ücreti ödemek yerine yalnızca Meta'nın net maliyetini ödersiniz.</p>
            </div>
            
            <div class="compare-box">
                <!-- Bad: Standard WP Credit Packages -->
                <div class="glass-card bad-card">
                    <h3 class="card-title" style="color: #ef4444;"><i class="fa-solid fa-box-open"></i> Aracı Paket Kiralama Modeli</h3>
                    <p class="card-text">Sürekli tekrar eden yüksek komisyonlu kredi tarifeleri:</p>
                    <ul class="price-list">
                        <li><span>1.000 Mesaj Kredisi</span> <strong>479 TL / Her İletimde</strong></li>
                        <li><span>2.000 Mesaj Kredisi</span> <strong>959 TL / Her İletimde</strong></li>
                        <li><span>5.000 Mesaj Kredisi</span> <strong>2.399 TL / Her İletimde</strong></li>
                        <li><span>10.000 Mesaj Kredisi</span> <strong>4.789 TL / Her İletimde</strong></li>
                    </ul>
                </div>

        </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        const currentSlideNumEl = document.getElementById('currentSlideNum');
        const totalSlidesNumEl = document.getElementById('totalSlidesNum');
        const navDotsEl = document.getElementById('navDots');

        totalSlidesNumEl.textContent = totalSlides;

        // Create navigation dots
        slides.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (idx === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(idx));
            navDotsEl.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        function updateSlideUI() {
            slides.forEach((slide, idx) => {
                slide.classList.toggle('active', idx === currentSlide);
                dots[idx].classList.toggle('active', idx === currentSlide);
            });
            currentSlideNumEl.textContent = currentSlide + 1;
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateSlideUI();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlideUI();
            }
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlideUI();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Cost Calculator Logic
        function updateCostCalc() {
            const count = parseInt(document.getElementById('calcSlider').value);
            document.getElementById('calcCountVal').textContent = `${count.toLocaleString('tr-TR')} Kişi`;

            // Standard WP Credit package tier approximation
            let classicTl = Math.round(count * 0.479);
            if (count >= 10000) classicTl = 4789;
            else if (count >= 5000) classicTl = 2399;
            else if (count >= 2000) classicTl = 959;
            else if (count >= 1000) classicTl = 479;

            document.getElementById('classicCostVal').textContent = `${classicTl.toLocaleString('tr-TR')} TL`;

            // Meta API cost approximation ($17 for 1800 msgs = ~$0.0094 per msg)
            const metaUsd = (count * 0.00944).toFixed(1);
            document.getElementById('metaCostVal').textContent = `~$${metaUsd} USD`;
        }
    </script>
